default:
  # uv's full (non-slim) Debian image, which includes make
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  before_script:
    - uv sync --locked --group dev
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

stages:
  - check

lint:
  stage: check
  script:
    - make lint

test:
  stage: check
  script:
    - make test
  coverage: '/^TOTAL.*\s+(\d+%)$/'
